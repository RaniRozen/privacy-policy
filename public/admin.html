<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<title>ניהול אישורי הגעה – בר מצווה של רני</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=__V__">
<style>
  .wrap{max-width:820px; padding-top:30px}
  .card{background:var(--paper); border:3px solid var(--ink); border-radius:14px; padding:16px; box-shadow:5px 5px 0 var(--ink); margin-bottom:16px}
  h1.a{font-family:'Permanent Marker',cursive; font-size:34px; margin:0 0 12px; color:#fff; text-shadow:3px 3px 0 var(--ink)}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px}
  .stat{border:3px solid var(--ink); border-radius:12px; padding:10px; text-align:center; background:#fffdf7}
  .stat b{display:block; font-family:'Permanent Marker',cursive; font-size:40px; line-height:1.1}
  .stat span{font-size:14px; font-weight:700}
  .stat.g{background:#c9f0d4} .stat.r{background:#ffd0cb} .stat.y{background:#ffe9a0} .stat.b{background:#c7e8f7}
  .bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .bar input{flex:1; min-width:150px}
  .chip{font:inherit; font-weight:700; padding:8px 14px; border:2px solid var(--ink); border-radius:20px; background:#fff; cursor:pointer}
  .chip.on{background:var(--y)}
  table{width:100%; border-collapse:collapse; margin-top:12px; background:#fffdf7}
  th,td{padding:9px 8px; border-bottom:1px solid #d8c394; text-align:right; vertical-align:top}
  th{background:var(--y); border-bottom:3px solid var(--ink); font-size:14px}
  .tag{display:inline-block; padding:2px 10px; border-radius:12px; font-weight:700; font-size:14px; border:2px solid var(--ink)}
  .tag.yes{background:#9be3b1} .tag.no{background:#ffaaa3}
  .note{font-size:13px; color:#5a4630}
  .del{background:none; border:0; cursor:pointer; font-size:18px}
  .small{padding:8px 14px; font-size:16px; box-shadow:3px 3px 0 var(--ink)}
  #login{max-width:380px; margin:12vh auto 0}
  .top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
  .empty{text-align:center; padding:24px; color:#5a4630}
  .acts{white-space:nowrap}
  .edit{background:none; border:0; cursor:pointer; font-size:18px; margin-left:4px}
  .modal-bg{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px}
  .modal-bg[hidden]{display:none}
  .modal{width:100%; max-width:380px; background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:6px 6px 0 var(--ink); padding:18px; display:flex; flex-direction:column; gap:12px; max-height:92vh; overflow:auto}
  .modal h2{margin:0; text-align:center; font-size:22px}
  .fl{font-weight:800; font-size:16px}
  .fl small{font-weight:400; font-size:13px}
  .modal input[type=text]{font:inherit; font-size:18px; padding:12px; border:3px solid var(--ink); border-radius:12px; background:#fffdf7; width:100%}
  .seg{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .seg button{font:inherit; font-weight:800; font-size:18px; padding:12px 6px; border:3px solid var(--ink); border-radius:12px; background:#fff; cursor:pointer}
  .seg button[data-v=yes].on{background:#9be3b1; box-shadow:3px 3px 0 var(--ink)}
  .seg button[data-v=no].on{background:#ffaaa3; box-shadow:3px 3px 0 var(--ink)}
  .counter.mini{gap:16px; margin-top:6px} .counter.mini output{font-size:46px; min-width:56px} .counter.mini .round{width:48px; height:48px; font-size:28px}
  .mrow{display:flex; gap:10px} .mrow .btn{flex:1; font-size:18px}
  .tag{white-space:nowrap}
  td:first-child b{overflow-wrap:anywhere}
  @media (max-width:560px){
    .hide-s{display:none}
    .wrap{padding-left:10px; padding-right:10px}
    .card{padding:12px}
    h1.a{font-size:28px}
    .stats{grid-template-columns:repeat(6,1fr); gap:8px}
    .stat{grid-column:span 3; padding:8px 4px}
    .stat:first-child{grid-column:span 6; display:flex; align-items:center; justify-content:center; gap:12px}
    .stat:first-child b{font-size:46px}
    .stat b{font-size:32px}
    .stat span{font-size:12px; display:block}
    .bar input{flex:1 1 100%}
    .chip{flex:1; text-align:center}
    th,td{padding:8px 5px}
    .tag{font-size:12px; padding:2px 8px}
    .edit,.del{font-size:20px; padding:6px}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="wrap">
  <section id="login" class="card" hidden>
    <h1 class="a" style="color:var(--ink);text-shadow:none">כניסת מנהל 🔒</h1>
    <form id="lf" style="display:flex;flex-direction:column;gap:12px">
      <input type="password" id="pw" placeholder="סיסמה" autocomplete="current-password" required
             style="font:inherit;font-size:18px;padding:13px;border:3px solid var(--ink);border-radius:12px">
      <button class="btn send" type="submit">כניסה</button>
      <p class="err" id="lerr"></p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="top">
      <h1 class="a">אישורי הגעה – רני 🎉</h1>
      <div class="bar">
        <button class="btn small" id="refresh" style="background:var(--b)">רענון</button>
        <a class="btn small" href="/api/admin/export.csv" style="background:#2fb35a;text-decoration:none">ייצוא ל-Excel</a>
        <button class="btn small" id="logout" style="background:var(--r)">יציאה</button>
      </div>
    </div>

    <div class="card">
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <div class="bar">
        <input type="text" id="q" placeholder="חיפוש לפי שם...">
        <button class="chip on" data-f="all">הכול</button>
        <button class="chip" data-f="yes">מגיעים</button>
        <button class="chip" data-f="no">לא מגיעים</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>שם</th><th>סטטוס</th><th>אנשים</th><th class="hide-s">נשלח</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>עדיין אין תשובות</div>
    </div>
  </section>
</main>

<div class="modal-bg" id="editBg" hidden>
  <form class="modal" id="editForm" role="dialog" aria-modal="true" aria-labelledby="eTitle">
    <h2 id="eTitle">עריכת אורח</h2>
    <label class="fl" for="eName">שם</label>
    <input id="eName" type="text" maxlength="60" autocomplete="off" enterkeyhint="done">
    <div class="seg" role="group" aria-label="סטטוס הגעה">
      <button type="button" data-v="yes">יגיעו</button>
      <button type="button" data-v="no">לא יגיעו</button>
    </div>
    <div id="eCountWrap">
      <div class="fl">כמה יהיו <small>(סה"כ, כולל המוזמן)</small></div>
      <div class="counter mini">
        <button type="button" class="round" id="eMinus" aria-label="פחות">−</button>
        <output id="eCount">1</output>
        <button type="button" class="round" id="ePlus" aria-label="יותר">+</button>
      </div>
    </div>
    <p class="err" id="eErr" role="alert"></p>
    <div class="mrow">
      <button class="btn send" type="submit">שמירה</button>
      <button class="btn" type="button" id="eCancel" style="background:#fff;color:var(--ink)">ביטול</button>
    </div>
  </form>
</div>

<script src="viewport.js?v=__V__"></script>
<script src="admin.js?v=__V__"></script>
</body>
</html>
