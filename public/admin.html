<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ניהול – בר המצווה של רני</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=__V__">
<style>
  .wrap{max-width:820px; padding-top:30px}
  .card{background:var(--paper); border:3px solid var(--ink); border-radius:14px; padding:16px; box-shadow:5px 5px 0 var(--ink); margin-bottom:16px}
  h1.a{font-family:'Permanent Marker',cursive; font-size:34px; margin:0 0 12px; color:#fff; text-shadow:3px 3px 0 var(--ink)}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px}
  .stat{border:3px solid var(--ink); border-radius:12px; padding:10px; text-align:center; background:#fffdf7}
  .stat b{display:block; font-family:'Permanent Marker',cursive; font-size:40px; line-height:1.1}
  .stat span{font-size:14px; font-weight:700}
  .stat.g{background:#c9f0d4} .stat.r{background:#ffd0cb} .stat.y{background:#ffe9a0} .stat.b{background:#c7e8f7}
  .bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .bar input{flex:1; min-width:150px}
  .chip{font:inherit; font-weight:700; padding:8px 14px; border:2px solid var(--ink); border-radius:20px; background:#fff; cursor:pointer}
  .chip.on{background:var(--y)}
  table{width:100%; border-collapse:collapse; margin-top:12px; background:#fffdf7}
  th,td{padding:9px 8px; border-bottom:1px solid #d8c394; text-align:right; vertical-align:top}
  th{background:var(--y); border-bottom:3px solid var(--ink); font-size:14px}
  .tag{display:inline-block; padding:2px 10px; border-radius:12px; font-weight:700; font-size:14px; border:2px solid var(--ink)}
  .tag.yes{background:#9be3b1} .tag.no{background:#ffaaa3}
  .note{font-size:13px; color:#5a4630}
  .del{background:none; border:0; cursor:pointer; font-size:18px}
  .small{padding:8px 14px; font-size:16px; box-shadow:3px 3px 0 var(--ink)}
  #login{max-width:380px; margin:12vh auto 0}
  .top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
  .empty{text-align:center; padding:24px; color:#5a4630}
  @media (max-width:560px){ .hide-s{display:none} }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="wrap">
  <section id="login" class="card" hidden>
    <h1 class="a" style="color:var(--ink);text-shadow:none">כניסת מנהל 🔒</h1>
    <form id="lf" style="display:flex;flex-direction:column;gap:12px">
      <input type="password" id="pw" placeholder="סיסמה" autocomplete="current-password" required
             style="font:inherit;font-size:18px;padding:13px;border:3px solid var(--ink);border-radius:12px">
      <button class="btn send" type="submit">כניסה</button>
      <p class="err" id="lerr"></p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="top">
      <h1 class="a">אישורי הגעה – רני 🎉</h1>
      <div class="bar">
        <button class="btn small" id="refresh" style="background:var(--b)">רענון</button>
        <a class="btn small" href="/api/admin/export.csv" style="background:#2fb35a;text-decoration:none">ייצוא ל-Excel</a>
        <button class="btn small" id="logout" style="background:var(--r)">יציאה</button>
      </div>
    </div>

    <div class="card">
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <div class="bar">
        <input type="text" id="q" placeholder="חיפוש לפי שם...">
        <button class="chip on" data-f="all">הכול</button>
        <button class="chip" data-f="yes">מגיעים</button>
        <button class="chip" data-f="no">לא מגיעים</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>שם</th><th>סטטוס</th><th>אנשים</th><th class="hide-s">נשלח</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>עדיין אין תשובות</div>
    </div>
  </section>
</main>

<script src="admin.js?v=__V__"></script>
</body>
</html>
